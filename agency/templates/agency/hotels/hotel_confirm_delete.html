{% extends 'agency/base.html' %}
{% block title %}Удаление отеля{% endblock %}
{% block content %}
<h1>Удалить отель «{{ hotel.name }}»?</h1>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-delete">Подтвердить удаление</button>
    <a href="{% url 'agency:hotel_list' %}" class="btn btn-back">Вернуться к списку отелей</a>
</form>
{% endblock %}
