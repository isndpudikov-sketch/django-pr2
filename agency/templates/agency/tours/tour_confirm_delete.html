{% extends 'agency/base.html' %}
{% block title %}Удаление тура{% endblock %}
{% block content %}
<h1>Удалить тур «{{ tour.title }}»?</h1>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-delete">Подтвердить удаление</button>
    <a href="{% url 'agency:tour_list' %}" class="btn btn-back">Вернуться к списку туров</a>
</form>
{% endblock %}
