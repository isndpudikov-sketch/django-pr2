{% extends 'agency/base.html' %}
{% block title %}{% if form.instance.pk %}Редактировать тур{% else %}Добавить тур{% endif %}{% endblock %}
{% block content %}
<h1>{% if form.instance.pk %}Редактировать тур{% else %}Добавить новый тур{% endif %}</h1>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{% url 'agency:tour_list' %}" class="btn btn-back">Отмена</a>
</form>
{% endblock %}
